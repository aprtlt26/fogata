<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ruta Cósmica - Interacción Flotante</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Courier New', monospace; }
        canvas { display: block; }

        #ui {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #a2ff00;
            font-size: 10px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border: 1px solid #a2ff00;
            z-index: 10;
            pointer-events: none;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #a2ff00;
            font-size: 9px;
            text-align: right;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border: 1px solid #a2ff00;
            z-index: 10;
            pointer-events: none;
        }
        #title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #a2ff00;
            font-size: 12px;
            letter-spacing: 4px;
            background: rgba(0,0,0,0.6);
            padding: 4px 20px;
            border: 1px solid #a2ff00;
            z-index: 10;
            pointer-events: none;
        }
        #players-count {
            position: fixed;
            top: 70px;
            right: 20px;
            color: #a2ff00;
            font-size: 9px;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border: 1px solid #a2ff00;
            z-index: 10;
            pointer-events: none;
        }
        #status {
            position: fixed;
            top: 70px;
            left: 20px;
            color: #44ff44;
            font-size: 8px;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border: 1px solid #44ff44;
            z-index: 10;
            pointer-events: none;
        }

        /* ===== INTERACCIÓN - VENTANA FLOTANTE PEQUEÑA ===== */
        #interaction-panel {
            position: fixed;
            background: rgba(0,0,0,0.92);
            border: 1.5px solid #ff8800;
            padding: 12px 16px;
            z-index: 100;
            display: none;
            text-align: center;
            min-width: 200px;
            max-width: 250px;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(255,136,0,0.2);
            animation: floatIn 0.3s ease;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        #interaction-panel .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        #interaction-panel .header h3 {
            color: #ff8800;
            font-size: 11px;
            font-weight: normal;
            letter-spacing: 1px;
            margin: 0;
        }
        #interaction-panel .header .close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.3s;
        }
        #interaction-panel .header .close-btn:hover {
            color: #ff8800;
            transform: rotate(90deg);
        }
        #interaction-panel .player-name {
            color: #ff8800;
            font-weight: bold;
            font-size: 10px;
        }
        #interaction-panel .cigarette-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 4px 0;
            font-size: 22px;
        }
        #interaction-panel .cigarette-status .status-text {
            color: #ff8800;
            font-size: 9px;
            letter-spacing: 0.5px;
        }
        #interaction-panel .btn-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }
        #interaction-panel button {
            background: transparent;
            border: 1px solid #ff8800;
            color: #ff8800;
            padding: 3px 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            transition: all 0.3s;
            border-radius: 4px;
            min-width: 50px;
            white-space: nowrap;
        }
        #interaction-panel button:hover:not(:disabled) {
            background: #ff8800;
            color: #000;
            transform: scale(1.05);
        }
        #interaction-panel button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        #interaction-panel button .btn-emoji {
            display: inline;
            margin-right: 2px;
        }
        #interaction-panel .mini-hint {
            font-size: 7px;
            color: #666;
            margin-top: 3px;
        }

        /* ===== NOTIFICACIÓN FLOTANTE ===== */
        .interaction-notification {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff8800;
            background: rgba(0,0,0,0.8);
            padding: 4px 16px;
            border: 1px solid #ff8800;
            border-radius: 20px;
            font-size: 10px;
            z-index: 50;
            animation: floatIn 0.3s ease;
            display: none;
            text-align: center;
        }

        /* ===== AUDIO ===== */
        #audio-panel {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 180px;
            background: rgba(0,0,0,0.85);
            border: 1px solid #a2ff00;
            padding: 10px;
            color: #a2ff00;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            z-index: 100;
            display: none;
            border-radius: 6px;
        }
        #audio-panel h3 {
            margin: 0 0 6px 0;
            font-weight: normal;
            letter-spacing: 2px;
            font-size: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 3px;
            color: #a2ff00;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .row label {
            flex: 0 0 40px;
            font-size: 7px;
            color: #aaa;
        }
        .row input[type="range"] {
            flex: 1;
            background: #222;
            height: 2px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }
        .row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 6px;
            height: 6px;
            background: #a2ff00;
            border-radius: 50%;
            cursor: pointer;
        }
        #audio-toggle {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 100;
            background: #0a0a0a;
            color: #a2ff00;
            border: 1px solid #a2ff00;
            padding: 3px 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            border-radius: 4px;
        }
        #audio-toggle:hover {
            background: #a2ff00;
            color: #000;
        }

        /* ===== CHAT (más pequeño) ===== */
        #chat-box {
            position: fixed;
            bottom: 60px;
            left: 20px;
            width: 200px;
            max-height: 100px;
            overflow-y: auto;
            background: rgba(0,0,0,0.8);
            border: 1px solid #a2ff00;
            padding: 4px 6px;
            z-index: 10;
            display: none;
            font-size: 8px;
            color: #ccc;
            border-radius: 4px;
        }
        #chat-box .msg {
            margin: 1px 0;
            padding: 1px 3px;
            border-bottom: 1px solid #1a1a1a;
        }
        #chat-box .msg .name {
            color: #a2ff00;
            font-weight: bold;
        }
        #chat-input {
            position: fixed;
            bottom: 60px;
            left: 20px;
            width: 200px;
            background: rgba(0,0,0,0.9);
            border: 1px solid #a2ff00;
            color: #a2ff00;
            padding: 3px 6px;
            font-family: 'Courier New', monospace;
            font-size: 8px;
            z-index: 10;
            display: none;
            outline: none;
            border-radius: 4px;
        }
        #chat-toggle {
            position: fixed;
            bottom: 52px;
            left: 230px;
            z-index: 10;
            background: #000;
            color: #a2ff00;
            border: 1px solid #a2ff00;
            padding: 1px 6px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 7px;
            display: none;
            border-radius: 4px;
        }
        #room-input {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            background: rgba(0,0,0,0.95);
            border: 2px solid #a2ff00;
            padding: 25px 35px;
            text-align: center;
            border-radius: 8px;
        }
        #room-input h2 {
            color: #a2ff00;
            font-size: 14px;
            font-weight: normal;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        #room-input input {
            background: #111;
            border: 1px solid #a2ff00;
            color: #a2ff00;
            padding: 6px 12px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            width: 180px;
            outline: none;
            text-align: center;
            border-radius: 4px;
        }
        #room-input button {
            background: transparent;
            border: 1px solid #a2ff00;
            color: #a2ff00;
            padding: 6px 18px;
            margin: 6px 4px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            transition: 0.3s;
            border-radius: 4px;
        }
        #room-input button:hover {
            background: #a2ff00;
            color: #000;
        }
        #room-input .small {
            font-size: 8px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="title">🌲 RUTA CÓSMICA</div>
    <div id="ui">🎮 Interacción Flotante</div>
    <div id="controls">← ↑ → ↓ · T: chat</div>
    <div id="players-count">👤 Jugadores: 1</div>
    <div id="status">✅ Conectado</div>

    <button id="audio-toggle">🎛️ SONIDO</button>

    <div id="audio-panel">
        <h3>🌊 RUIDO BLANCO</h3>
        <div class="row"><label>Vol</label><input type="range" id="noise-vol" min="0" max="1" step="0.01" value="0.4"></div>
        <div class="row"><label>Filtro</label><input type="range" id="noise-filter" min="0" max="1" step="0.01" value="0.3"></div>
        <div class="row"><label>Olas</label><input type="range" id="noise-wave" min="0" max="1" step="0.01" value="0.5"></div>
        <div style="margin-top:4px; display:flex; gap:4px;">
            <button id="noise-play" style="background:#000;border:1px solid #a2ff00;color:#a2ff00;padding:1px 10px;cursor:pointer;font-size:8px;">▶</button>
            <button id="noise-stop" style="background:#000;border:1px solid #ff4444;color:#ff4444;padding:1px 10px;cursor:pointer;font-size:8px;">⏹</button>
        </div>
    </div>

    <!-- INTERACCIÓN - VENTANA FLOTANTE PEQUEÑA -->
    <div id="interaction-panel">
        <div class="header">
            <h3>🚬</h3>
            <button class="close-btn" onclick="cerrarInteraccion()">✕</button>
        </div>
        <div style="font-size:9px;color:#aaa;">con <span class="player-name" id="interaction-player">Alguien</span></div>
        <div class="cigarette-status">
            <span id="cigarette-emoji">🚬</span>
            <span class="status-text" id="cigarette-state-text">📦</span>
        </div>
        <div class="btn-group">
            <button id="btn-armar"><span class="btn-emoji">📦</span>Armar</button>
            <button id="btn-encender" disabled><span class="btn-emoji">🔥</span>Encender</button>
            <button id="btn-fumar" disabled><span class="btn-emoji">💨</span>Fumar</button>
            <button id="btn-rotar" disabled><span class="btn-emoji">🔄</span>Rotar</button>
        </div>
        <div class="mini-hint">Acércate a otro jugador</div>
    </div>

    <div class="interaction-notification" id="interaction-notif">
        🔥 <span id="notif-text">Alguien te encontró!</span>
    </div>

    <div id="room-input">
        <h2>✦ SALA DE JUEGO ✦</h2>
        <input type="text" id="room-field" placeholder="Nombre..." value="bosque">
        <br>
        <button id="room-create">🎮 ENTRAR</button>
        <div class="small">Comparte el nombre con amigos</div>
    </div>

    <div id="chat-box"></div>
    <input id="chat-input" type="text" placeholder="Escribe..." maxlength="100">
    <button id="chat-toggle">💬</button>

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ============================================================
        // 1. SONIDO
        // ============================================================
        let audioCtx = null;
        let noiseNode = null;
        let noiseGain = null;
        let filterNode = null;
        let waveOsc = null;
        let isNoisePlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.4;
                noiseGain.connect(audioCtx.destination);
                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 800;
                filterNode.connect(noiseGain);
                waveOsc = audioCtx.createOscillator();
                waveOsc.frequency.value = 0.5;
                waveOsc.type = 'sine';
                const waveGain = audioCtx.createGain();
                waveGain.gain.value = 0.08;
                waveOsc.connect(waveGain);
                waveGain.connect(noiseGain);
            }
        }

        function playNoise() {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (isNoisePlaying) return;
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.3;
                }
                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;
                noiseNode.connect(filterNode);
                noiseNode.start();
                if (waveOsc) waveOsc.start();
                isNoisePlaying = true;
                document.getElementById('noise-play').textContent = '▶▶';
            } catch(e) { console.log('Audio error:', e); }
        }

        function stopNoise() {
            try {
                if (noiseNode) {
                    noiseNode.stop();
                    noiseNode.disconnect();
                    noiseNode = null;
                }
                if (waveOsc) {
                    waveOsc.stop();
                    waveOsc = audioCtx.createOscillator();
                    waveOsc.frequency.value = 0.5;
                    waveOsc.type = 'sine';
                    const waveGain = audioCtx.createGain();
                    waveGain.gain.value = 0.08;
                    waveOsc.connect(waveGain);
                    waveGain.connect(noiseGain);
                }
                isNoisePlaying = false;
                document.getElementById('noise-play').textContent = '▶';
            } catch(e) {}
        }

        document.getElementById('noise-play').addEventListener('click', playNoise);
        document.getElementById('noise-stop').addEventListener('click', stopNoise);
        document.getElementById('noise-vol').addEventListener('input', (e) => {
            if (noiseGain) noiseGain.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('noise-filter').addEventListener('input', (e) => {
            if (filterNode) filterNode.frequency.value = 100 + parseFloat(e.target.value) * 4000;
        });
        document.getElementById('noise-wave').addEventListener('input', (e) => {
            if (waveOsc) waveOsc.frequency.value = 0.1 + parseFloat(e.target.value) * 1.5;
        });

        document.getElementById('audio-toggle').addEventListener('click', () => {
            const panel = document.getElementById('audio-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });

        // ============================================================
        // 2. CONFIGURACIÓN
        // ============================================================
        let myPeer = null;
        let connections = {};
        let players = {};
        let myId = null;
        let roomName = 'bosque';
        let playerName = 'Viajero';
        let playerColor = '#88dd88';
        let playerChar = '☺';
        let selectedPlayer = null;
        let cigaretteState = '📦';
        let interactionActive = false;
        let lastInteractionCheck = 0;
        let panelX = 0;
        let panelY = 0;

        // ============================================================
        // 3. ESCENA 3D
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 150);
        camera.position.set(12, 8, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.prepend(renderer.domElement);

        // LUCES
        const ambient = new THREE.AmbientLight(0x223355, 0.4);
        scene.add(ambient);
        const moonLight = new THREE.DirectionalLight(0x6688cc, 0.3);
        moonLight.position.set(-10, 15, -10);
        scene.add(moonLight);
        const dirLight = new THREE.DirectionalLight(0xffeedd, 0.5);
        dirLight.position.set(10, 20, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ============================================================
        // 4. FUNCIONES ASCII
        // ============================================================
        function createAsciiSprite(char, color, size = 0.4) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);
            ctx.fillStyle = color;
            ctx.font = '48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 32, 34);
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(size, size, 1);
            return sprite;
        }

        // ============================================================
        // 5. CREAR AVATAR
        // ============================================================
        function createAvatar3D(color, char = '☺', name = '', isMine = false) {
            const group = new THREE.Group();

            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: color, 
                emissive: new THREE.Color(color), 
                emissiveIntensity: 0.15 
            });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.6, 0.3), bodyMat);
            body.position.y = 0.32;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            const headMat = new THREE.MeshStandardMaterial({ color: 0xddbb88 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8), headMat);
            head.position.y = 0.72;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);

            const eyeMat = new THREE.MeshStandardMaterial({ 
                color: 0xa2ff00, 
                emissive: new THREE.Color(0xa2ff00), 
                emissiveIntensity: 0.3 
            });
            const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8), eyeMat);
            eye1.position.set(0.1, 0.76, 0.2);
            group.add(eye1);
            const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8), eyeMat);
            eye2.position.set(-0.1, 0.76, 0.2);
            group.add(eye2);

            const mouthMat = new THREE.MeshStandardMaterial({ color: 0x442222 });
            const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.02, 0.02), mouthMat);
            mouth.position.set(0, 0.67, 0.2);
            group.add(mouth);

            const armMat = new THREE.MeshStandardMaterial({ color: 0x88dd88 });
            const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.35, 6), armMat);
            armL.position.set(-0.3, 0.5, 0);
            armL.rotation.z = 0.2;
            armL.rotation.x = 0.1;
            armL.castShadow = true;
            group.add(armL);
            const armR = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.35, 6), armMat);
            armR.position.set(0.3, 0.5, 0);
            armR.rotation.z = -0.2;
            armR.rotation.x = -0.1;
            armR.castShadow = true;
            group.add(armR);

            const legMat = new THREE.MeshStandardMaterial({ color: 0x446644 });
            const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.25, 6), legMat);
            legL.position.set(-0.1, 0.0, 0);
            legL.castShadow = true;
            group.add(legL);
            const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.25, 6), legMat);
            legR.position.set(0.1, 0.0, 0);
            legR.castShadow = true;
            group.add(legR);

            if (name) {
                const nameSprite = createAsciiSprite(
                    isMine ? `✦ ${name}` : name, 
                    isMine ? '#ff8800' : '#a2ff00', 
                    0.08
                );
                nameSprite.position.y = 0.95;
                group.add(nameSprite);
            }

            const soul = createAsciiSprite(char, isMine ? '#ff8800' : '#88dd88', 0.1);
            soul.position.set(0.3, 0.45, 0);
            group.add(soul);

            group.userData = {
                walkCycle: 0,
                idleSway: Math.random() * Math.PI * 2,
                armSway: 0,
                expression: 'normal'
            };

            return group;
        }

        // ============================================================
        // 6. CONSTRUIR BOSQUE
        // ============================================================
        const treeChars = ['🌲', '🌳', '▲', '♦', '♣', '⏚'];
        const treeColors = ['#2a6a2a', '#3a7a3a', '#1a5a1a', '#4a8a4a'];

        for (let i = 0; i < 400; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 25;
            const x = Math.sin(angle) * radius;
            const z = Math.cos(angle) * radius;
            if (Math.abs(x) < 4 && Math.abs(z) < 4) continue;
            const char = treeChars[Math.floor(Math.random() * treeChars.length)];
            const color = treeColors[Math.floor(Math.random() * treeColors.length)];
            const size = 0.3 + Math.random() * 0.9;

                case 'ArrowLeft': keys.left = true; e.preventDefault(); break;

                case 'Escape': if (chatOpen) closeChat(); break;

        document.addEventListener('keyup', (e) => {

        // ============================================================

        function toggleChat() {
            chatOpen = !chatOpen;
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            const toggle = document.getElementById('chat-toggle');
            if (chatOpen) {
                input.style.display = 'block';
                box.style.display = 'block';
                toggle.style.display = 'none';
                input.focus();
            } else {
                input.style.display = 'none';
                box.style.display = 'none';
                toggle.style.display = 'block';
            }
        }

        function closeChat() {
            chatOpen = false;
            document.getElementById('chat-input').style.display = 'none';
            document.getElementById('chat-box').style.display = 'none';
            document.getElementById('chat-toggle').style.display = 'block';
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (msg) {
                broadcast({ type: 'chat', id: myId, name: playerName, message: msg });
                addChatMessage(playerName, msg, '#a2ff00');
                input.value = '';
            }
        }

        function addChatMessage(name, message, color = '#a2ff00') {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="name" style="color:${color}">${name}:</span> ${message}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            if (box.children.length > 30) box.removeChild(box.firstChild);
        }

        document.getElementById('chat-toggle').addEventListener('click', toggleChat);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        // ============================================================
        // 9. INTERACCIÓN FLOTANTE
        // ============================================================
        function checkInteraction() {
            const now = Date.now();
            if (now - lastInteractionCheck < 800) return;
            lastInteractionCheck = now;

            let nearest = null;
            let nearestDist = 4.5;

            for (const id in players) {
                if (id === myId) continue;
                const p = players[id];
                const dx = playerPos.x - (p.x || 0);
                const dz = playerPos.z - (p.z || 0);
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearest = id;
                }
            }

            if (nearest && players[nearest] && !interactionActive) {
                selectedPlayer = nearest;
                interactionActive = true;
                mostrarInteraccion(players[nearest].name);
                
                const notif = document.getElementById('interaction-notif');
                document.getElementById('notif-text').textContent = `🔥 ${players[nearest].name} te encontró!`;
                notif.style.display = 'block';
                setTimeout(() => {
                    notif.style.display = 'none';
                }, 2000);

                try {
                    if (audioCtx) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        gain.gain.value = 0.08;
                        osc.frequency.value = 440;
                        osc.type = 'sine';
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.1);
                    }
                } catch(e) {}

            } else if ((!nearest || nearestDist > 5) && interactionActive) {
                interactionActive = false;
                cerrarInteraccion();
            }
        }

            panel.style.top = y + 'px';
            panel.style.width = panelWidth + 'px';
            
            actualizarEstadoCigarrillo();
            
            const btnArmar = document.getElementById('btn-armar');

        // ============================================================
        // 11. PEERJS
        // ============================================================
        const avatarColors = [
            '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff',
            '#ff9f43', '#00d2d3', '#f368e0', '#ff9ff3', '#54a0ff'
        ];
        const avatarChars = ['☺', '◉', '●', '♦', '★', '☻', '♥', '♣'];

        function connectToRoom() {
            const room = document.getElementById('room-field').value.trim() || 'bosque';
            roomName = room;
            playerColor = avatarColors[Math.floor(Math.random() * avatarColors.length)];
            playerChar = avatarChars[Math.floor(Math.random() * avatarChars.length)];

            myPeer = new Peer(undefined, { debug: 0 });

            myPeer.on('open', (id) => {
                myId = id;
                document.getElementById('status').textContent = `✅ Conectado`;
                document.getElementById('room-input').style.display = 'none';
                
                myAvatar = createAvatar3D(playerColor, playerChar, playerName, true);
                myAvatar.position.set(0, -0.3, 0);
                avatarContainer.add(myAvatar);
                
                try {
                    const conn = myPeer.connect(room);
                    conn.on('open', () => {
                        connections[room] = conn;
                        setupConnection(conn);
                    });
                } catch(e) {
                    myPeer = new Peer(room, { debug: 0 });
                    myPeer.on('open', () => {
                        myId = room;
                        myPeer.on('connection', (conn) => {
                            connections[conn.peer] = conn;
                            setupConnection(conn);
                        });
                    });
                }
                
                myPeer.on('connection', (conn) => {
                    connections[conn.peer] = conn;
                    setupConnection(conn);
                });
            });

            myPeer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    myPeer = new Peer(room, { debug: 0 });
                    myPeer.on('open', () => {
                        myId = room;
                        document.getElementById('status').textContent = `✅ Sala creada`;
                        document.getElementById('room-input').style.display = 'none';
                        myAvatar = createAvatar3D(playerColor, playerChar, playerName, true);
                        myAvatar.position.set(0, -0.3, 0);
                        avatarContainer.add(myAvatar);
                        myPeer.on('connection', (conn) => {
                            connections[conn.peer] = conn;
                            setupConnection(conn);
                        });
                    });
                }
            });
        }

        function setupConnection(conn) {
            conn.on('data', (data) => {
                handlePeerData(data, conn.peer);
            });
            conn.on('close', () => {
                delete connections[conn.peer];
                if (players[conn.peer]) {
                    const name = players[conn.peer].name || 'Alguien';
                    addChatMessage(name, '🚶 Se fue', '#ff4444');
                    delete players[conn.peer];
                    updatePlayers();
                    document.getElementById('players-count').textContent = `👤 Jugadores: ${Object.keys(players).length + 1}`;
                }
                if (selectedPlayer === conn.peer) {
                    cerrarInteraccion();
                    interactionActive = false;
                }
            });
            setTimeout(() => {
                conn.send({
                    type: 'join',
                    id: myId,
                    name: playerName,
                    color: playerColor,
                    char: playerChar,
                    x: playerPos.x,
                    y: 0,
                    z: playerPos.z
                });
            }, 500);
        }

        function handlePeerData(data, peerId) {
            switch(data.type) {
                case 'join':
                    players[data.id] = {
                        id: data.id,
                        name: data.name || 'Viajero',
                        color: data.color || '#88dd88',
                        char: data.char || '☺',
                        x: data.x || 0,
                        y: data.y || 0,
                        z: data.z || 0
                    };
                    updatePlayers();
                    document.getElementById('players-count').textContent = `👤 Jugadores: ${Object.keys(players).length + 1}`;
                    addChatMessage(data.name || 'Alguien', '👋 Entró', '#44ff44');
                    break;

                case 'move':
                    if (players[data.id]) {
                        players[data.id].x = data.x;
                        players[data.id].y = data.y || 0;
                        players[data.id].z = data.z;
                        updatePlayerPosition(data.id);
                    }
                    break;

                case 'chat':
                    addChatMessage(data.name, data.message, players[data.id]?.color || '#a2ff00');
                    break;

                case 'cigarette':
                    if (data.id !== myId) {
                        const name = data.name || players[data.id]?.name || 'Alguien';
                        const states = {
                            '📦': '📦 guardado',
                            '🔧': '🔧 armando...',
                            '📦✅': '📦✅ armado!',
                            '🔥': '🔥 encendido!',
                            '💨': '💨 fumando...'
                        };
                        addChatMessage(name, `🚬 ${states[data.state] || data.state}`, '#ff8800');
                        if (data.state === '🔥') {
                            const notif = document.getElementById('interaction-notif');
                            document.getElementById('notif-text').textContent = `🔥 ${name} encendió!`;
                            notif.style.display = 'block';
                            setTimeout(() => {
                                notif.style.display = 'none';
                            }, 2000);
                        }
                    }
                    break;

                case 'cigarette_pass':
                    if (data.target === myId) {
                        const name = data.name || players[data.id]?.name || 'Alguien';
                        cigaretteState = data.state || '📦';
                        actualizarEstadoCigarrillo();
                        addChatMessage('Sistema', `🚬 ${name} te pasó un cigarrillo!`, '#ff8800');
                        if (!interactionActive) {
                            interactionActive = true;
                            selectedPlayer = data.id;
                            mostrarInteraccion(name);
                        }
                    }
                    break;
            }
        }

        function broadcast(data) {
            for (const id in connections) {
                try { connections[id].send(data); } catch(e) {}
            }
        }

        // ============================================================
        // 12. ACTUALIZAR JUGADORES
        // ============================================================
        function updatePlayers() {
            const toRemove = [];
            avatarContainer.children.forEach(child => {
                if (child !== myAvatar) toRemove.push(child);
            });
            toRemove.forEach(child => avatarContainer.remove(child));
            
            for (const id in players) {
                if (id === myId) continue;
                const p = players[id];
                const avatar = createAvatar3D(p.color, p.char, p.name, false);
                avatar.position.set(p.x || 0, p.y || 0, p.z || 0);
                avatarContainer.add(avatar);
            }
        }

        function updatePlayerPosition(id) {
            updatePlayers();
        }

        // ============================================================
        // 13. MOVIMIENTO
        // ============================================================
        function updateMyPosition() {
            if (!myAvatar) return;
            
            let dx = 0, dz = 0;
            if (keys.up) dz -= speed;
            if (keys.down) dz += speed;
            if (keys.left) dx -= speed;
            if (keys.right) dx += speed;

            const isMoving = dx !== 0 || dz !== 0;
            const now = Date.now() * 0.001;

            if (isMoving) {
                playerPos.x += dx;
                playerPos.z += dz;
                
                const radius = 26;
                const dist = Math.sqrt(playerPos.x ** 2 + playerPos.z ** 2);
                if (dist > radius) {
                    playerPos.x *= 0.97;
                    playerPos.z *= 0.97;
                }
                
                myAvatar.position.x = playerPos.x;
                myAvatar.position.z = playerPos.z;
                myAvatar.rotation.y = Math.atan2(dx, dz);
                
                const walkCycle = Math.sin(now * 8) * 0.25;
                myAvatar.children.forEach(child => {
                    if (child.geometry && child.geometry.type === 'CylinderGeometry') {
                        if (child.position.y < 0.1) {
                            child.rotation.x = walkCycle * (child.position.x > 0 ? 1 : -1);
                        }
                        if (child.position.y > 0.35 && child.position.y < 0.6) {
                            child.rotation.x = -walkCycle * 0.4 * (child.position.x > 0 ? 1 : -1);
                        }
                    }
                });

                broadcast({
                    type: 'move',
                    id: myId,
                    x: playerPos.x,
                    y: 0,
                    z: playerPos.z
                });
            } else {
                const idleSway = Math.sin(now * 0.5 + myAvatar.userData.idleSway) * 0.015;
                myAvatar.rotation.z = idleSway;
            }

            if (!interactionActive) {
                checkInteraction();
            }
        }

        // ============================================================
        // 14. CÁMARA
        // ============================================================
        function updateCamera() {
            const target = new THREE.Vector3(playerPos.x, 0, playerPos.z);
            const offset = new THREE.Vector3(6, 4.5, 8);
            camera.position.lerp(target.clone().add(offset), 0.05);
            camera.lookAt(target);
        }

        // ============================================================
        // 15. ANIMAR MUNDO
        // ============================================================
        function animateWorld() {
            const time = Date.now() * 0.001;
            
            buhos.forEach((buho) => {
                const data = buho.userData;
                data.angle += data.speed;
                buho.position.x = Math.sin(data.angle) * data.radius;
                buho.position.z = Math.cos(data.angle) * data.radius;
                buho.position.y = 1.5 + Math.sin(time * data.ySpeed + data.yOffset) * 1.5;
            });
            
            animales.forEach((animal) => {
                const data = animal.userData;
                data.angle += data.speed;
                animal.position.x = Math.sin(data.angle) * data.radius;
                animal.position.z = Math.cos(data.angle) * data.radius;
                data.visibleTimer += 0.01;
                if (animal.visible && data.visibleTimer > data.visibleDuration) {
                    animal.visible = false;
                    data.visibleTimer = 0;
                } else if (!animal.visible && data.visibleTimer > data.hiddenDuration) {
                    animal.visible = true;
                    data.visibleTimer = 0;
                    data.angle = Math.random() * Math.PI * 2;
                    data.radius = 6 + Math.random() * 14;
                }
            });
            
            if (cigaretteState === '🔥' || cigaretteState === '💨') {
                const fireTime = Date.now() * 0.003;
                fogataGroup.children.forEach((child, i) => {
                    if (child.isSprite && child.material) {
                        const colors = ['#ff4400', '#ff6600', '#ff8800', '#ffaa00', '#ffcc44'];
                        const idx = Math.floor((fireTime + i * 0.5) % colors.length);
                        child.material.color.set(colors[idx]);
                        const s = 1 + Math.sin(fireTime + i) * 0.12;
                        child.scale.set(s, s, 1);
                    }
                });
            }
        }

        // ============================================================
        // 16. LOOP
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            updateMyPosition();
            animateWorld();
            updateCamera();
            renderer.render(scene, camera);
        }

        // ============================================================
        // 17. INICIO
        // ============================================================
        document.getElementById('room-create').addEventListener('click', () => {
            const name = document.getElementById('room-field').value.trim() || 'bosque';
            playerName = prompt('¿Cómo te llamas?', 'Viajero') || 'Viajero';
            document.getElementById('room-field').value = name;
            connectToRoom();
            initAudio();
        });

        document.getElementById('room-field').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('room-create').click();
        });

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌲 Ruta Cósmica - Interacción Flotante');
        console.log('🎮 Flechas para moverte | T: chat');
        console.log('🚬 Acércate a otro jugador para interactuar');
        console.log('📱 Ventana pequeña flotando sobre los personajes');
    </script>
