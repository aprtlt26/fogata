<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <title>🌲 Ruta Cósmica - Mundo Esférico</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #ui {
            position: fixed;
            bottom: 20px;
            left: 20px;

        }
        #controls {

            color: #a2ff00;
            font-size: 8px;

            padding: 4px 10px;

            z-index: 10;
            pointer-events: none;
            border-radius: 4px;
        }

            position: fixed;
            top: 20px;
            left: 50%;

            border: 1px solid #a2ff00;

        #status {

            top: 65px;
            left: 20px;

            background: rgba(0,0,0,0.6);
            padding: 3px 10px;
            border: 1px solid #44ff44;
            z-index: 10;

        }

        /* ===== INTERACCIÓN FLOTANTE ===== */
        #interaction-panel {
            position: fixed;
            background: rgba(0,0,0,0.9);
            border: 1.5px solid #ff8800;
            padding: 10px 14px;
            z-index: 100;
            display: none;
            text-align: center;
            min-width: 190px;
            max-width: 230px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,136,0,0.15);
            animation: floatIn 0.3s ease;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        #interaction-panel .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }
        #interaction-panel .header h3 {
            color: #ff8800;
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 1px;
            margin: 0;
        }
        #interaction-panel .header .close-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.3s;
        }
        #interaction-panel .header .close-btn:hover {
            color: #ff8800;
            transform: rotate(90deg);
        }
        #interaction-panel .player-name {

        }
        #interaction-panel .cigarette-status {

        }
        #interaction-panel .btn-group {

            justify-content: center;
            margin-top: 3px;
        }
        #interaction-panel button {
            background: transparent;
            border: 1px solid #ff8800;
            color: #ff8800;
            padding: 2px 7px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 7px;

            border-radius: 3px;
            min-width: 44px;
        }
        #interaction-panel button:hover:not(:disabled) {

            color: #000;

        }
        #interaction-panel button:disabled {
            opacity: 0.25;

        /* ===== NOTIFICACIÓN ===== */
        .interaction-notification {
            position: fixed;

            border-radius: 20px;

        #audio-panel {
            position: fixed;
            top: 95px;

        /* ===== CHAT ===== */
        #chat-box {
            position: fixed;

<body>

    <!-- INTERACCIÓN FLOTANTE -->

    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.128.0/examples/jsm/controls/OrbitControls.js';

        // ============================================================
        // 1. SONIDO
        // ============================================================
        let audioCtx = null;
        let noiseNode = null;
        let noiseGain = null;
        let filterNode = null;
        let waveOsc = null;
        let isNoisePlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.35;
                noiseGain.connect(audioCtx.destination);
                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.value = 800;
                filterNode.connect(noiseGain);
                waveOsc = audioCtx.createOscillator();
                waveOsc.frequency.value = 0.5;
                waveOsc.type = 'sine';
                const waveGain = audioCtx.createGain();
                waveGain.gain.value = 0.06;
                waveOsc.connect(waveGain);
                waveGain.connect(noiseGain);
            }
        }

        function playNoise() {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (isNoisePlaying) return;
                const bufferSize = audioCtx.sampleRate * 0.05;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * 0.25;
                }
                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;
                noiseNode.connect(filterNode);
                noiseNode.start();
                if (waveOsc) waveOsc.start();
                isNoisePlaying = true;
                document.getElementById('noise-play').textContent = '▶▶';
            } catch(e) { console.log('Audio error:', e); }
        }

        function stopNoise() {
            try {
                if (noiseNode) {
                    noiseNode.stop();
                    noiseNode.disconnect();
                    noiseNode = null;
                }
                if (waveOsc) {
                    waveOsc.stop();
                    waveOsc = audioCtx.createOscillator();
                    waveOsc.frequency.value = 0.5;
                    waveOsc.type = 'sine';
                    const waveGain = audioCtx.createGain();
                    waveGain.gain.value = 0.06;
                    waveOsc.connect(waveGain);
                    waveGain.connect(noiseGain);
                }
                isNoisePlaying = false;
                document.getElementById('noise-play').textContent = '▶';
            } catch(e) {}
        }

        document.getElementById('noise-play').addEventListener('click', playNoise);
        document.getElementById('noise-stop').addEventListener('click', stopNoise);
        document.getElementById('noise-vol').addEventListener('input', (e) => {
            if (noiseGain) noiseGain.gain.value = parseFloat(e.target.value);
        });
        document.getElementById('noise-filter').addEventListener('input', (e) => {
            if (filterNode) filterNode.frequency.value = 100 + parseFloat(e.target.value) * 4000;
        });
        document.getElementById('noise-wave').addEventListener('input', (e) => {
            if (waveOsc) waveOsc.frequency.value = 0.1 + parseFloat(e.target.value) * 1.5;
        });

        document.getElementById('audio-toggle').addEventListener('click', () => {
            const panel = document.getElementById('audio-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });

        // ============================================================
        // 2. CONFIGURACIÓN
        // ============================================================
        let myPeer = null;
        let connections = {};
        let players = {};
        let myId = null;
        let roomName = 'bosque';
        let playerName = 'Viajero';
        let playerColor = '#88dd88';
        let playerChar = '☺';
        let selectedPlayer = null;
        let cigaretteState = '📦';
        let interactionActive = false;
        let lastInteractionCheck = 0;
        let cameraAngle = 0;
        let cameraHeight = 6;
        let cameraDistance = 10;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // ============================================================
        // 3. ESCENA 3D (con terreno esférico)
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.005);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(12, 8, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ============================================================
        // 4. CONTROL DE CÁMARA (orbit manual + zoom)
        // ============================================================
        function updateCamera() {
            const target = new THREE.Vector3(playerPos.x, 0, playerPos.z);
            const offsetX = Math.sin(cameraAngle) * cameraDistance;
            const offsetZ = Math.cos(cameraAngle) * cameraDistance;
            camera.position.lerp(
                new THREE.Vector3(
                    target.x + offsetX,
                    cameraHeight,
                    target.z + offsetZ
                ),
                0.05
            );
            camera.lookAt(target);
        }

        // Control con ratón
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                cameraAngle -= dx * 0.005;
                cameraHeight = Math.max(2, Math.min(12, cameraHeight - dy * 0.02));
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Zoom con scroll
        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            cameraDistance = Math.max(4, Math.min(18, cameraDistance + e.deltaY * 0.01));
        }, { passive: false });

        // ============================================================
        // 5. LUCES
        // ============================================================
        const ambient = new THREE.AmbientLight(0x223355, 0.5);
        scene.add(ambient);
        
        const moonLight = new THREE.DirectionalLight(0x6688cc, 0.3);
        moonLight.position.set(-10, 15, -10);
        scene.add(moonLight);
        
        const sunLight = new THREE.DirectionalLight(0xffeedd, 0.6);
        sunLight.position.set(10, 20, 5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 60;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        scene.add(sunLight);

        const fireLight = new THREE.PointLight(0xff4400, 0, 8);
        fireLight.position.set(0, 0.5, 0);
        scene.add(fireLight);

        // ============================================================
        // 6. FUNCIONES: CREAR SPRITES Y PERSONAJES
        // ============================================================
        function createAsciiSprite(char, color, size = 0.35) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 64, 64);
            ctx.fillStyle = color;
            ctx.font = '48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(char, 32, 34);
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            const material = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(size, size, 1);
            return sprite;
        }

        // ============================================================
        // 7. CREAR PERSONAJE (más realista)
        // ============================================================
        function createPersonaje3D(color, char = '☺', name = '', isMine = false) {
            const group = new THREE.Group();

            // Cuerpo con forma más natural
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: color, 
                emissive: new THREE.Color(color), 
                emissiveIntensity: 0.1,
                roughness: 0.6,
                metalness: 0.1
            });
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 0.6, 8), bodyMat);
            body.position.y = 0.35;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Cabeza
            const headMat = new THREE.MeshStandardMaterial({ 
                color: 0xddbb88,
                roughness: 0.4,
                metalness: 0.0
            });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), headMat);
            head.position.y = 0.75;
            head.castShadow = true;
            head.receiveShadow = true;
            group.add(head);

            // Ojos (con brillo y expresivos)
            const eyeMat = new THREE.MeshStandardMaterial({ 
                color: 0xa2ff00, 
                emissive: new THREE.Color(0xa2ff00), 
                emissiveIntensity: 0.3,
                roughness: 0.1,
                metalness: 0.0
            });
            const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), eyeMat);
            eye1.position.set(0.1, 0.79, 0.2);
            group.add(eye1);
            const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), eyeMat);
            eye2.position.set(-0.1, 0.79, 0.2);
            group.add(eye2);

                emissive: new THREE.Color(0x0a1a0a),
                emissiveIntensity: 0.1

            const copa = new THREE.Mesh(new THREE.SphereGeometry(ancho * 0.6, 6, 6), leafMat);

            copa.scale.y = 0.7 + Math.random() * 0.2;

            copa.receiveShadow = true;
            group.add(copa);

            const copa2 = new THREE.Mesh(new THREE.SphereGeometry(ancho * 0.4, 6, 6), leafMat);
            copa2.position.set(
                (Math.random() - 0.5) * ancho * 0.4,

                (Math.random() - 0.5) * ancho * 0.4

        // ============================================================
        // 10. CONTROLES
        // ============================================================
        const keys = { up: false, down: false, left: false, right: false };
        let chatOpen = false;

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp': keys.up = true; e.preventDefault(); break;
                case 'ArrowDown': keys.down = true; e.preventDefault(); break;
                case 'ArrowLeft': keys.left = true; e.preventDefault(); break;
                case 'ArrowRight': keys.right = true; e.preventDefault(); break;
                case 't': case 'T': e.preventDefault(); toggleChat(); break;
                case 'Enter': if (chatOpen) sendChat(); break;
                case 'Escape': if (chatOpen) closeChat(); break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.key) {
                case 'ArrowUp': keys.up = false; e.preventDefault(); break;
                case 'ArrowDown': keys.down = false; e.preventDefault(); break;
                case 'ArrowLeft': keys.left = false; e.preventDefault(); break;
                case 'ArrowRight': keys.right = false; e.preventDefault(); break;
            }
        });

        // ============================================================
        // 11. CHAT
        // ============================================================
        function toggleChat() {
            chatOpen = !chatOpen;
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            const toggle = document.getElementById('chat-toggle');
            if (chatOpen) {
                input.style.display = 'block';
                box.style.display = 'block';
                toggle.style.display = 'none';
                input.focus();
            } else {
                input.style.display = 'none';
                box.style.display = 'none';
                toggle.style.display = 'block';
            }
        }

        function closeChat() {
            chatOpen = false;
            document.getElementById('chat-input').style.display = 'none';
            document.getElementById('chat-box').style.display = 'none';
            document.getElementById('chat-toggle').style.display = 'block';
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (msg) {
                broadcast({ type: 'chat', id: myId, name: playerName, message: msg });
                addChatMessage(playerName, msg, '#a2ff00');
                input.value = '';
            }
        }

        function addChatMessage(name, message, color = '#a2ff00') {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="name" style="color:${color}">${name}:</span> ${message}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            if (box.children.length > 30) box.removeChild(box.firstChild);
        }

        document.getElementById('chat-toggle').addEventListener('click', toggleChat);
        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        // ============================================================
        // 12. INTERACCIÓN FLOTANTE
        // ============================================================
        function checkInteraction() {
            const now = Date.now();
            if (now - lastInteractionCheck < 800) return;
            lastInteractionCheck = now;

            let nearest = null;
            let nearestDist = 4.5;

            for (const id in players) {
                if (id === myId) continue;
                const p = players[id];
                const dx = playerPos.x - (p.x || 0);
                const dz = playerPos.z - (p.z || 0);
                const dist = Math.sqrt(dx*dx + dz*dz);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearest = id;
                }
            }

            if (nearest && players[nearest] && !interactionActive) {
                selectedPlayer = nearest;
                interactionActive = true;
                mostrarInteraccion(players[nearest].name);
                
                const notif = document.getElementById('interaction-notif');
                document.getElementById('notif-text').textContent = `🔥 ${players[nearest].name} te encontró!`;
                notif.style.display = 'block';
                setTimeout(() => {
                    notif.style.display = 'none';
                }, 2000);

                try {
                    if (audioCtx) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        gain.gain.value = 0.06;
                        osc.frequency.value = 440;
                        osc.type = 'sine';
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.1);
                    }
                } catch(e) {}

            } else if ((!nearest || nearestDist > 5) && interactionActive) {
                interactionActive = false;
                cerrarInteraccion();
            }
        }

        function mostrarInteraccion(name) {
            const panel = document.getElementById('interaction-panel');
            panel.style.display = 'block';
            document.getElementById('interaction-player').textContent = name;
            
            // Posición flotante (arriba-centro)
            const panelWidth = 210;
            const panelHeight = 140;
            const x = (window.innerWidth - panelWidth) / 2;
            const y = window.innerHeight * 0.08;
            panel.style.left = x + 'px';
            panel.style.top = y + 'px';
            panel.style.width = panelWidth + 'px';
            
            actualizarEstadoCigarrillo();
            
            const btnArmar = document.getElementById('btn-armar');
            const btnEncender = document.getElementById('btn-encender');
            const btnFumar = document.getElementById('btn-fumar');
            const btnRotar = document.getElementById('btn-rotar');
            
            btnArmar.disabled = cigaretteState !== '📦';
            btnEncender.disabled = cigaretteState !== '📦✅';
            btnFumar.disabled = cigaretteState !== '🔥';
            btnRotar.disabled = cigaretteState !== '🔥' && cigaretteState !== '💨';
        }

        function cerrarInteraccion() {
            document.getElementById('interaction-panel').style.display = 'none';
            interactionActive = false;
        }

        function actualizarEstadoCigarrillo() {
            const emojis = {
                '📦': '🚬',
                '🔧': '🔧',
                '📦✅': '📦✅',
                '🔥': '🔥',
                '💨': '💨'
            };
            const textos = {
                '📦': '📦 Listo',
                '🔧': '🔧 Armando',
                '📦✅': '📦✅ Armado',
                '🔥': '🔥 Encendido',
                '💨': '💨 Fumando'
            };
            document.getElementById('cigarette-emoji').textContent = emojis[cigaretteState] || '🚬';
            document.getElementById('cigarette-state-text').textContent = textos[cigaretteState] || '📦 Listo';
            
            const status = document.getElementById('cigarette-state-text');
            if (cigaretteState === '🔥' || cigaretteState === '💨') {
                status.style.color = '#ff4400';
                status.style.textShadow = '0 0 15px #ff4400';
                // Luz de fuego en el personaje
                if (myAvatar) {
                    const light = new THREE.PointLight(0xff4400, 0.3, 2);
                    light.position.set(0.1, 0.5, 0.2);
                    myAvatar.add(light);
                    setTimeout(() => {
                        if (myAvatar) myAvatar.remove(light);
                    }, 3000);
                }
            } else {
                status.style.color = '#ff8800';
                status.style.textShadow = 'none';
            }
        }

        function updateCigarette(state) {
            cigaretteState = state;
            actualizarEstadoCigarrillo();
            
            if (selectedPlayer) {
                broadcast({
                    type: 'cigarette',
                    id: myId,
                    state: state,
                    target: selectedPlayer,
                    name: playerName
                });
            }
        }

                addChatMessage('Sistema', '💨 *fuma profundamente*', '#ff8800');
                
                // Humo en cascada
                if (myAvatar) {
                    const smokePositions = [
                        { x: 0.15, y: 0.85, z: 0.15, size: 0.12 },
                        { x: 0.1, y: 0.95, z: 0.1, size: 0.1 },
                        { x: 0.05, y: 1.05, z: 0.05, size: 0.08 },
                        { x: 0.0, y: 1.15, z: 0.0, size: 0.06 }
                    ];
                    smokePositions.forEach((pos, index) => {
                        setTimeout(() => {
                            if (myAvatar) {

                                smoke.position.set(pos.x, pos.y, pos.z);

        document.getElementById('btn-rotar').addEventListener('click', () => {
            if (selectedPlayer && players[selectedPlayer] && (cigaretteState === '🔥' || cigaretteState === '💨')) {

                broadcast({
                    type: 'cigarette_pass',

                    name: playerName
                });
                addChatMessage('Sistema', `🔄 Le pasaste el cigarrillo a ${targetName}`, '#ff8800');
                
                // Animación de pasar
                if (myAvatar) {
                    myAvatar.children.forEach(child => {
                        if (child.geometry && child.geometry.type === 'CylinderGeometry' && child.position.x > 0.2) {
                            child.rotation.x = 1.5;
                            setTimeout(() => {
                                child.rotation.x = -0.1;
                            }, 500);
                        }
                    });
                }
                
                cigaretteState = '📦';
                actualizarEstadoCigarrillo();
                document.getElementById('btn-encender').disabled = true;
                document.getElementById('btn-fumar').disabled = true;
                document.getElementById('btn-rotar').disabled = true;
                cerrarInteraccion();
            }
        });

        // ============================================================
        // 14. PEERJS - MULTIJUGADOR
        // ============================================================
        const avatarColors = [
            '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6bff',
            '#ff9f43', '#00d2d3', '#f368e0', '#ff9ff3', '#54a0ff'
        ];
        const avatarChars = ['☺', '◉', '●', '♦', '★', '☻', '♥', '♣'];

        function connectToRoom() {
            const room = document.getElementById('room-field').value.trim() || 'bosque';
            roomName = room;
            playerColor = avatarColors[Math.floor(Math.random() * avatarColors.length)];
            playerChar = avatarChars[Math.floor(Math.random() * avatarChars.length)];

            myPeer = new Peer(undefined, { debug: 0 });

            myPeer.on('open', (id) => {
                myId = id;
                document.getElementById('status').textContent = `✅ Conectado`;
                document.getElementById('room-input').style.display = 'none';
                
                myAvatar = createPersonaje3D(playerColor, playerChar, playerName, true);
                myAvatar.position.set(0, -0.2, 0);
                avatarContainer.add(myAvatar);
                
                try {
                    const conn = myPeer.connect(room);
                    conn.on('open', () => {
                        connections[room] = conn;
                        setupConnection(conn);
                    });
                } catch(e) {
                    myPeer = new Peer(room, { debug: 0 });
                    myPeer.on('open', () => {
                        myId = room;
                        myPeer.on('connection', (conn) => {
                            connections[conn.peer] = conn;
                            setupConnection(conn);
                        });
                    });
                }
                
                myPeer.on('connection', (conn) => {
                    connections[conn.peer] = conn;
                    setupConnection(conn);
                });
            });

            myPeer.on('error', (err) => {
                if (err.type === 'peer-unavailable') {
                    myPeer = new Peer(room, { debug: 0 });
                    myPeer.on('open', () => {
                        myId = room;
                        document.getElementById('status').textContent = `✅ Sala creada`;
                        document.getElementById('room-input').style.display = 'none';
                        myAvatar = createPersonaje3D(playerColor, playerChar, playerName, true);
                        myAvatar.position.set(0, -0.2, 0);
                        avatarContainer.add(myAvatar);
                        myPeer.on('connection', (conn) => {
                            connections[conn.peer] = conn;
                            setupConnection(conn);
                        });
                    });
                }
            });
        }

        function setupConnection(conn) {
            conn.on('data', (data) => {
                handlePeerData(data, conn.peer);
            });
            conn.on('close', () => {
                delete connections[conn.peer];
                if (players[conn.peer]) {
                    const name = players[conn.peer].name || 'Alguien';
                    addChatMessage(name, '🚶 Se fue', '#ff4444');
                    delete players[conn.peer];
                    updatePlayers();
                    document.getElementById('players-count').textContent = `👤 Jugadores: ${Object.keys(players).length + 1}`;
                }
                if (selectedPlayer === conn.peer) {
                    cerrarInteraccion();
                    interactionActive = false;
                }
            });
            setTimeout(() => {
                conn.send({
                    type: 'join',
                    id: myId,
                    name: playerName,
                    color: playerColor,
                    char: playerChar,
                    x: playerPos.x,
                    y: 0,
                    z: playerPos.z
                });
            }, 500);
        }

        function handlePeerData(data, peerId) {
            switch(data.type) {
                case 'join':
                    players[data.id] = {
                        id: data.id,
                        name: data.name || 'Viajero',
                        color: data.color || '#88dd88',
                        char: data.char || '☺',
                        x: data.x || 0,
                        y: data.y || 0,
                        z: data.z || 0
                    };
                    updatePlayers();
                    document.getElementById('players-count').textContent = `👤 Jugadores: ${Object.keys(players).length + 1}`;
                    addChatMessage(data.name || 'Alguien', '👋 Entró', '#44ff44');
                    break;

                case 'move':
                    if (players[data.id]) {
                        players[data.id].x = data.x;
                        players[data.id].y = data.y || 0;
                        players[data.id].z = data.z;
                        updatePlayerPosition(data.id);
                    }
                    break;

                case 'chat':
                    addChatMessage(data.name, data.message, players[data.id]?.color || '#a2ff00');
                    break;

                case 'cigarette':
                    if (data.id !== myId) {
                        const name = data.name || players[data.id]?.name || 'Alguien';
                        const states = {
                            '📦': '📦 guardado',
                            '🔧': '🔧 armando...',
                            '📦✅': '📦✅ armado!',
                            '🔥': '🔥 encendido!',
                            '💨': '💨 fumando...'
                        };
                        addChatMessage(name, `🚬 ${states[data.state] || data.state}`, '#ff8800');
                        if (data.state === '🔥') {
                            const notif = document.getElementById('interaction-notif');
                            document.getElementById('notif-text').textContent = `🔥 ${name} encendió!`;
                            notif.style.display = 'block';
                            setTimeout(() => {
                                notif.style.display = 'none';
                            }, 2000);
                        }
                    }
                    break;

                case 'cigarette_pass':
                    if (data.target === myId) {
                        const name = data.name || players[data.id]?.name || 'Alguien';
                        cigaretteState = data.state || '📦';
                        actualizarEstadoCigarrillo();
                        addChatMessage('Sistema', `🚬 ${name} te pasó un cigarrillo!`, '#ff8800');
                        if (!interactionActive) {
                            interactionActive = true;
                            selectedPlayer = data.id;
                            mostrarInteraccion(name);
                        }
                    }
                    break;
            }
        }

        function broadcast(data) {
            for (const id in connections) {
                try { connections[id].send(data); } catch(e) {}
            }
        }

        // ============================================================
        // 15. ACTUALIZAR JUGADORES
        // ============================================================
        function updatePlayers() {
            const toRemove = [];
            avatarContainer.children.forEach(child => {
                if (child !== myAvatar) toRemove.push(child);
            });
            toRemove.forEach(child => avatarContainer.remove(child));
            
            for (const id in players) {
                if (id === myId) continue;
                const p = players[id];
                const avatar = createPersonaje3D(p.color, p.char, p.name, false);
                avatar.position.set(p.x || 0, p.y || 0, p.z || 0);
                avatarContainer.add(avatar);
            }
        }

        function updatePlayerPosition(id) {
            updatePlayers();
        }

        // ============================================================
        // 16. MOVIMIENTO
        // ============================================================
        function updateMyPosition() {
            if (!myAvatar) return;
            
            let dx = 0, dz = 0;
            if (keys.up) dz -= speed;
            if (keys.down) dz += speed;
            if (keys.left) dx -= speed;
            if (keys.right) dx += speed;

            const isMoving = dx !== 0 || dz !== 0;
            const now = Date.now() * 0.001;

            if (isMoving) {
                playerPos.x += dx;
                playerPos.z += dz;
                
                // Limitar al terreno esférico
                const radius = 17;
                const dist = Math.sqrt(playerPos.x ** 2 + playerPos.z ** 2);
                if (dist > radius) {
                    playerPos.x *= 0.97;
                    playerPos.z *= 0.97;
                }
                
                // Altura según el terreno (efecto esférico)
                const heightFactor = 1 - (dist / radius);
                const y = -0.2 + heightFactor * 0.3;
                playerPos.y = y;
                
                myAvatar.position.x = playerPos.x;
                myAvatar.position.y = y;
                myAvatar.position.z = playerPos.z;
                myAvatar.rotation.y = Math.atan2(dx, dz);
                
                // Animación de caminar
                const walkCycle = Math.sin(now * 8) * 0.25;
                myAvatar.children.forEach(child => {
                    if (child.geometry && child.geometry.type === 'CylinderGeometry') {
                        if (child.position.y < 0.1) {
                            child.rotation.x = walkCycle * (child.position.x > 0 ? 1 : -1);
                        }
                        if (child.position.y > 0.4 && child.position.y < 0.7) {
                            child.rotation.x = -walkCycle * 0.4 * (child.position.x > 0 ? 1 : -1);
                        }
                    }
                });

                broadcast({
                    type: 'move',
                    id: myId,
                    x: playerPos.x,
                    y: y,
                    z: playerPos.z
                });
            } else {
                // Balanceo
                const idleSway = Math.sin(now * 0.5 + myAvatar.userData.idleSway) * 0.01;
                myAvatar.rotation.z = idleSway;
            }

            // Verificar interacción
            if (!interactionActive) {
                checkInteraction();
            }
        }

        // ============================================================
        // 17. ANIMAR MUNDO
        // ============================================================
        function animateWorld() {
            const time = Date.now() * 0.001;
            
            // Búhos
            buhos.forEach((buho) => {
                const data = buho.userData;
                data.angle += data.speed;
                buho.position.x = Math.sin(data.angle) * data.radius;
                buho.position.z = Math.cos(data.angle) * data.radius;
                buho.position.y = 1.5 + Math.sin(time * data.ySpeed + data.yOffset) * 1.5;
            });
            
            // Animales
            animales.forEach((animal) => {
                const data = animal.userData;
                data.angle += data.speed;
                animal.position.x = Math.sin(data.angle) * data.radius;
                animal.position.z = Math.cos(data.angle) * data.radius;
                data.visibleTimer += 0.01;
                if (animal.visible && data.visibleTimer > data.visibleDuration) {
                    animal.visible = false;
                    data.visibleTimer = 0;
                } else if (!animal.visible && data.visibleTimer > data.hiddenDuration) {
                    animal.visible = true;
                    data.visibleTimer = 0;
                    data.angle = Math.random() * Math.PI * 2;
                    data.radius = 4 + Math.random() * 13;
                }
            });
            
            // Fuego
            const fireTime = Date.now() * 0.003;
            fireParticles.forEach((particle, i) => {
                const data = particle.userData;
                const heightOffset = Math.sin(fireTime * data.speed + data.phase) * 0.15;
                particle.position.y = 0.05 + data.height + heightOffset;
                const scale = 1 + Math.sin(fireTime * data.speed + data.phase) * 0.3;
                particle.scale.set(scale, scale * 1.5, scale);
                
                // Color del fuego
                const colors = ['#ff4400', '#ff6600', '#ff8800', '#ffaa00', '#ffcc44'];
                const idx = Math.floor((fireTime + i * 0.3) % colors.length);
                particle.material.color.set(colors[idx]);
                particle.material.emissive.set(colors[idx]);
            });
            
            // Luz de fuego parpadea
            fireLight.intensity = 0.5 + Math.sin(fireTime * 2) * 0.3;
        }

        // ============================================================
        // 18. LOOP PRINCIPAL
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);
            updateMyPosition();
            animateWorld();
            updateCamera();
            renderer.render(scene, camera);
        }

        // ============================================================
        // 19. INICIO
        // ============================================================
        document.getElementById('room-create').addEventListener('click', () => {
            const name = document.getElementById('room-field').value.trim() || 'bosque';
            playerName = prompt('¿Cómo te llamas?', 'Viajero') || 'Viajero';
            document.getElementById('room-field').value = name;
            connectToRoom();
            initAudio();
        });

        document.getElementById('room-field').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('room-create').click();
        });

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('🌲 Ruta Cósmica - Mundo Esférico');
        console.log('🎮 Flechas: mover | Click+arrastrar: girar cámara | Scroll: zoom');
        console.log('🚬 Acércate a otro jugador para interactuar');
        console.log('🏔️ Terreno curvo, árboles grandes, madera para sentarse');
    </script>
</body>
